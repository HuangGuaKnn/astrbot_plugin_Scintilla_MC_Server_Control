name: tests

# push / PR 时自动跑回归测试：
#   · regression  —— tests/test_*.py（纯逻辑，无需浏览器）→ 硬门禁
#   · ui-contract —— tests/ui_*_check.py 里的**契约类**（DOM 结构 / 状态 / 顺序 / 折叠边界）→ 硬门禁
#   · ui-render   —— 同目录里的**渲染 / 度量类**（像素阈值、配色）→ 观察期不阻断
# 本机权威环境仍是 Windows + 系统 Edge（`python tests\ui_xxx_check.py`）；
# CI 上没有 Edge，改走 SCINTILLA_UI_CHANNEL=bundled（playwright 自带 Chromium）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    # 想同时验证 Windows 可改成 matrix: os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        # psutil：插件可选依赖；astrbot：tests/_paths.py 用它反推 AstrBot 运行目录
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil astrbot
      - name: 语法检查（compileall）
        run: python -m compileall -q main.py core pages tests || exit 1
      - name: 跑回归测试
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "======== $f"
            python "$f" || fail=1
          done
          exit $fail

  ui-contract:
    # 外部审查（第 4 轮）后按用户拍板的方案 B 拆分：**契约类**进硬门禁。
    # 判据只跟「页面自己写没写对」有关（DOM 结构 / 状态 / 顺序 / 折叠边界），
    # 与字体、滚动条宽度、亚像素取整无关 —— 这类绿了就是真的没回归，红就该挡住。
    # （渲染 / 度量类在同文件的 ui-render job，观察期仍不阻断。）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCINTILLA_UI_CHANNEL: bundled          # 不指定 channel，直接用 playwright 自带 Chromium
      # 两份清单**必须显式列名**：新写的 ui_*_check.py 若没被归类，下面的守工会红 ——
      # 不许「新用例默认漂进软门禁」，那正是这一轮要修的那类洞。
      HARD_UI: >-
        ui_broadcast_order_check ui_fp_notice_check ui_kb_detail_check
        ui_rcon_adv_fold_check ui_remote_blur_check ui_settings_structure_check
        ui_theme_check ui_theme_persist_check ui_version_override_check
      SOFT_UI: >-
        ui_card_layout_check ui_kb_fold_check ui_select_option_check ui_sw_wrap_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil astrbot playwright
          python -m playwright install --with-deps chromium
      - name: 清单守卫（每个 ui_*_check.py 都必须被归类）
        run: |
          miss=0
          for f in tests/ui_*_check.py; do
            b="$(basename "$f" .py)"
            case " $HARD_UI $SOFT_UI " in
              *" $b "*) ;;
              *) echo "::error::未归类的 UI 用例：$b（硬门禁还是观察期？显式写进 HARD_UI / SOFT_UI）"; miss=1 ;;
            esac
          done
          exit $miss
      - name: 跑 UI 契约类用例（硬门禁）
        run: |
          fail=0
          for b in $HARD_UI; do
            echo "======== tests/$b.py"
            python "tests/$b.py" || fail=1
          done
          exit $fail
      - name: 留档截图（失败时也上传，便于比对）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-contract-shots
          path: tests/_shots/
          if-no-files-found: ignore
          retention-days: 7

  ui-render:
    # 渲染 / 度量类：判据里含**像素阈值**（同排等高 / 顶边对齐 / 内容高度上限 / 行盒 /
    # 原生下拉配色），Linux + 自带 Chromium 与本机 Windows + Edge 的渲染细节不完全一致。
    # 观察期先「跑起来、看得见」；用户看过几轮绿灯后删掉 continue-on-error 即升为硬门槛。
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      SCINTILLA_UI_CHANNEL: bundled
      SOFT_UI: >-
        ui_card_layout_check ui_kb_fold_check ui_select_option_check ui_sw_wrap_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil astrbot playwright
          python -m playwright install --with-deps chromium
      - name: 跑 UI 渲染 / 度量类用例（观察期，不阻断）
        run: |
          fail=0
          for b in $SOFT_UI; do
            echo "======== tests/$b.py"
            python "tests/$b.py" || fail=1
          done
          exit $fail
      - name: 留档截图（失败时也上传，便于比对）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-shots
          path: tests/_shots/
          if-no-files-found: ignore
          retention-days: 7

