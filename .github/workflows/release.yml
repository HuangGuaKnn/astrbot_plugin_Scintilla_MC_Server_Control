name: release

# 发版流程：改 metadata.yaml 的 version → push → 打 tag → 剩下的交给这里。
#   git tag v0.21.39 && git push origin v0.21.39
# 附件用 git archive 生成（跟随 .gitattributes 的 export-ignore，不含 tests/），
# 文件名与历史 Release 保持一致，旧下载链接继续有效。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验标签与 metadata.yaml 版本是否一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version:' metadata.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/^v//' | tr -d '"'"'"' | tr -d '\r')
          echo "tag=$tag  metadata=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::标签与 metadata.yaml 版本不一致（$tag != $ver）"
            exit 1
          fi
      - name: 打包 zip
        run: |
          name="astrbot_plugin_Scintilla_MC_Server_Control_${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=astrbot_plugin_Scintilla_MC_Server_Control/ -o "$name" HEAD
          ls -lh "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
