name: release

# 发版流程：改 metadata.yaml 的 version → push → 打 tag（推送 tag 即触发本流程）。
#   git tag -a v0.21.39 -m "..." && git push origin v0.21.39
# 附件用 git archive 生成（跟随 .gitattributes 的 export-ignore，不含 tests/），
# 文件名与历史 Release 保持一致，旧下载链接继续有效。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验标签与 metadata.yaml 版本是否一致
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          ver="$(awk '/^version:/{print $2; exit}' metadata.yaml)"
          ver="${ver%\"}"; ver="${ver#\"}"; ver="${ver#v}"
          echo "tag=$tag  metadata=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::标签与 metadata.yaml 版本不一致（$tag != $ver）"
            exit 1
          fi
      - name: 打包 zip（不含 tests/）
        run: |
          set -e
          name="astrbot_plugin_Scintilla_MC_Server_Control_${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=astrbot_plugin_Scintilla_MC_Server_Control/ -o "$name" HEAD
          ls -lh "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - name: 生成 Release 说明（优先取 CHANGELOG.md 对应小节）
        run: |
          set -e
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \\[/ {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then rm -f notes.md; echo "CHANGELOG 没找到对应小节，改用自动生成"; fi
          wc -l notes.md 2>/dev/null || true
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
