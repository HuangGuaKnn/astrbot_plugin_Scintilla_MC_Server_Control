name: release

# 发版流程：改 metadata.yaml 的 version → push → 打 tag（推送 tag 即触发本流程）。
#   git tag -a v0.21.39 -m "..." && git push origin v0.21.39
# 附件用 git archive 生成（跟随 .gitattributes 的 export-ignore，不含 tests/），
# 文件名与历史 Release 保持一致，旧下载链接继续有效。
#
# 发布通道（唯一来源 = tag 本身，判定逻辑见 run_release_channel.py）：
#   vX.Y.Z          → 正式版
#   vX.Y.Z-rc.N     → 预发布（Release 标 pre-release，不占「Latest」正式版位置）
# metadata.yaml 的版本号始终写 X.Y.Z（不带 -rc.N）；CHANGELOG 小节按 `## [vX.Y.Z]` 取。
# v0.24.8 之前这里靠「CHANGELOG 小节标题里有没有『预发布』三个字」判定 —— 文案一改
# 发布性质就跟着漂（v0.24.7 的标题没写，靠人事后手动改成 pre-release 才正确），
# GPT 第三轮复核 B7 点名要收成单一来源。
#
# 外部审查 D4 已修：发布前必须**测试全绿**（verify job），publish 依赖它。
# v0.23.5 第五轮：verify 扩到**与 CI 同一套**（含 UI 契约类硬门禁），见 verify job 注释。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    # 为什么在这里重跑一遍，而不是复用 tests.yml 的 run：
    #   · 跨 workflow 没有 needs —— tests.yml 的结论在别的 workflow 里，门关不上；
    #   · 也不能去查「这个 SHA 的 tests 跑过没」—— tag 常常紧跟 push，那个 run 可能还在排队，
    #     查到的多半是「进行中」，要么误拦、要么得写轮询等待，脆弱。
    # 所以把同一套用例在原地重跑：结果只取决于**这个 commit 本身**，与 CI 先后顺序无关。
    #
    # v0.23.5 第五轮（GPT 复核）：这里原先只跑 `compileall` + `tests/test_*.py` ——
    # **UI 契约类用例（tests/ui_*_check.py 里的硬门禁）一条都没跑**，于是「打个 tag
    # 直接发版」可以绕过整个 UI 契约层（tests.yml 就算红了也拦不住发版）。
    # 现在改跑 `run_release_verify.py`：静态 + 回归 + UI 契约类，与 CI 同一份清单、
    # 同一套逐文件超时；清单来自 tests/_ui_manifest.py（唯一来源，不再各抄一份）。
    #
    # `--ci` 的含义：UI 部分只跑 `CI_OK` 白名单里那几件（实测能在 ubuntu 上跑通）——
    # 第一次上云实测时 9 件契约类红了 5 件（含一件硬编码本机路径的真 bug，已修），
    # 于是「与发版同款」的判据只能取这个子集；剩余用例由本机
    # `run_v0230_all.py` 全量覆盖。依据见 tests/_ui_manifest.py 顶部。
    runs-on: ubuntu-latest
    env:
      SCINTILLA_UI_CHANNEL: bundled          # 不指定 channel，直接用 playwright 自带 Chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖与浏览器
        # psutil：插件可选依赖；astrbot：tests/_paths.py 用它反推 AstrBot 运行目录；
        # playwright + chromium：UI 契约类用例要用（与 tests.yml 的 ui-contract 同款）
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil astrbot playwright
          python -m playwright install --with-deps chromium
      - name: 发布前验证（静态 + 回归 + UI 契约类，与 CI 同一套）
        run: |
          set -o pipefail
          python run_release_verify.py --ci 2>&1 | tee /tmp/verify.log
      - name: 失败时把红点写成注解（日志需登录才能看，注解不需要）
        if: failure()
        run: |
          test -f /tmp/verify.log || exit 0
          grep -A 6 -E '^\[FAIL\]' /tmp/verify.log | head -60 \
            | while IFS= read -r line; do echo "::error title=发版前置红点::$line"; done
      - name: 校验标签与 metadata.yaml 版本是否一致
        # 放在 verify 而不是 publish：能便宜地失败的事就早失败，别等打完包再发现版本号写错。
        # 判定走 run_release_channel.py（与发布通道同一份实现）：`-rc.N` 只是发布通道，
        # 版本号仍是 X.Y.Z —— 用 shell 的 ${tag%-rc.*} 各写一遍迟早会漂。
        run: |
          set -e
          ver="$(awk '/^version:/{print $2; exit}' metadata.yaml)"
          echo "tag=$GITHUB_REF_NAME  metadata=$ver"
          python run_release_channel.py --tag "$GITHUB_REF_NAME" --expect "$ver"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 zip（不含 tests/）
        run: |
          set -e
          name="astrbot_plugin_Scintilla_MC_Server_Control_${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=astrbot_plugin_Scintilla_MC_Server_Control/ -o "$name" HEAD
          ls -lh "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - name: 生成 Release 说明（优先取 CHANGELOG.md 对应小节）
        run: |
          set -e
          # 小节标题按**版本号**取（v0.24.8），不带 -rc.N —— 预发布与正式版共用同一节，
          # rc 只是通道，不是另一个版本（否则每打一个 rc 就要在 CHANGELOG 里抄一遍）。
          ver="v$(python run_release_channel.py --tag "$GITHUB_REF_NAME" --print version)"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 {flag = 1; next}
            flag && index($0, "## [") == 1 {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then rm -f notes.md; echo "CHANGELOG 里没有对应小节，改用自动生成"; fi
          wc -l notes.md 2>/dev/null || true
      - name: 追加「上一个正式版 → 本版」的 Full changes 链接
        # 基线只认**真实发布状态**（prerelease == false），不能靠 CHANGELOG 标题推断 ——
        # v0.22.3 / v0.22.4 的小节没写「（预发布）」，但它们从未发过 Release，纯文本会误判。
        # 本步失败**不阻断发布**：拿不到基线就只是说明末尾少一行链接。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f notes.md ]; then echo "没有自定义说明（走 --generate-notes），跳过"; exit 0; fi
          prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  --jq '.[] | select(.prerelease == false) | .tag_name' \
                  | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)"
          if [ -n "$prev" ]; then
            printf '\n---\n\n**Full changes**（上一个正式版 %s → %s）：%s/%s/compare/%s...%s\n' \
              "$prev" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
            echo "已追加 Full changes 链接：$prev → $GITHUB_REF_NAME"
          else
            echo "未找到上一个正式版，跳过"
          fi
      - name: 判定发布通道（唯一来源：tag 本身）
        # 不再读 CHANGELOG 文案：`v0.24.8` → 正式版；`v0.24.8-rc.1` → 预发布。
        # 判定与「标签/版本一致性校验」共用 run_release_channel.py 这一份实现。
        run: |
          set -e
          python run_release_channel.py --tag "$GITHUB_REF_NAME" --github-env >> "$GITHUB_ENV"
          python run_release_channel.py --tag "$GITHUB_REF_NAME"
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" $PRERELEASE \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" $PRERELEASE \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
