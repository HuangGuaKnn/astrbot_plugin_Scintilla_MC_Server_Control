name: Bug 反馈
description: 插件报错、功能不符合预期、界面异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！麻烦尽量填全下面几项，排查会快很多。
        本插件的行为随 **Minecraft 版本分水岭**（1.13 / 1.14 / 1.20.5 …）改变，
        所以「服务端版本」务必写准 —— 差一个版本，结论可能正好相反。
        （如果只是「怎么用」的问题，先看 README 的常见问题，可能已经有答案。）
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 插件 WebUI「插件信息」卡片，或 metadata.yaml 里的 version
      placeholder: v0.23.7
    validations:
      required: true
  - type: input
    id: astrbot_version
    attributes:
      label: AstrBot 版本
      placeholder: v4.17.0（Dashboard 里可查）
    validations:
      required: true
  - type: dropdown
    id: server_kind
    attributes:
      label: 服务端类型
      options:
        - 原版（Vanilla）
        - Paper / Spigot / Bukkit（插件端）
        - Forge（模组端）
        - Fabric（模组端）
        - NeoForge（模组端）
        - 整合包（在下文写整合包名）
        - 其他
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: 服务端版本
      description: |
        请写具体版本号（不要只写「最新版」）；模组端 / 插件端把加载器版本一起写上。
        你的版本在不在实测范围内、已知边界是什么，见 README 的「版本支持」页（docs/compatibility.md）。
      placeholder: 1.20.1 ／ 1.20.1-forge-47.4.23 ／ 1.21.1-neoforge-21.1.72 ／ Paper 1.21.1-133
    validations:
      required: true
  - type: dropdown
    id: deploy_mode
    attributes:
      label: 部署方式
      options:
        - 与 AstrBot 同机（本地直连 RCON + server_dir）
        - 异地 RCON（端口映射，服务端在另一台机器）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 现象与复现步骤
      placeholder: |
        1. 在什么页面 / 发了什么指令（原话照抄）
        2. 期望的结果
        3. 实际的结果（插件实际执行或拒绝的命令原文，有就贴上）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: AstrBot 控制台或日志里的报错片段；服务端控制台的相关回执也欢迎
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过 Issues，没有重复问题
          required: true
        - label: 已抹掉日志里的 RCON 密码、会话 ID、服务器地址等敏感信息
          required: true
